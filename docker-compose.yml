version: '3.8'
# =============================================
# TaskFlow Todo App - Docker Compose
# Usage: docker-compose up --build
# =============================================
services:
  # ---- React Todo App ----
  todo-app:
    image: viprana21/mytodoapp:latest
      dockerfile: Dockerfile
    container_name: taskflow-todo-app
    ports:
      - "3000:80"       # localhost:3000 pe access karo
    restart: unless-stopped
    networks:
      - taskflow-network
    environment:
      - NODE_ENV=production
    labels:
      - "app=taskflow"
      - "version=1.0.0"

# =============================================
# Network
# =============================================
networks:
  taskflow-network:
    driver: bridge
    name: taskflow-net
